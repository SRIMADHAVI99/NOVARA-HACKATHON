{% extends "base.html" %}

{% block content %}
<div style="text-align: center; margin-bottom: 3rem;">
    <h1 style="font-size: 3rem; margin-bottom: 1rem; color: var(--text-main);">AI-Powered Road Damage Detection System</h1>
    <p style="font-size: 1.2rem; color: var(--text-muted); max-width: 700px; margin: 0 auto;">
        Helping citizens report road issues and enabling authorities to fix them faster using AI.
    </p>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-bottom: 4rem;">
    <!-- Citizen Role -->
    <a href="/citizen_login" style="text-decoration: none; color: inherit;">
        <div class="card text-center hover-card" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;">
            <div style="width: 100px; height: 100px; border-radius: 50%; background: #e0e7ff; color: var(--primary-color); display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 1.5rem;">
                <i class="fa-solid fa-users"></i>
            </div>
            <h2 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--primary-color);">Citizen</h2>
            <p class="text-muted" style="font-size: 1.1rem;">Report road damage in your area.</p>
        </div>
    </a>

    <!-- Officer Role -->
    <a href="/officer_login" style="text-decoration: none; color: inherit;">
        <div class="card text-center hover-card" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;">
            <div style="width: 100px; height: 100px; border-radius: 50%; background: #fce7f3; color: var(--accent-color); display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 1.5rem;">
                <i class="fa-solid fa-building-shield"></i>
            </div>
            <h2 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--accent-color);">Officer</h2>
            <p class="text-muted" style="font-size: 1.1rem;">View and manage reported road damages.</p>
        </div>
    </a>
</div>

<style>
    .hover-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
</style>
{% endblock %}
