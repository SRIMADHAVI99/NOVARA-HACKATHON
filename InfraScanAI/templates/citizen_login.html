{% extends "base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; margin-top: 4rem;">
    <div class="card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1rem;">
                <i class="fa-solid fa-user"></i>
            </div>
            <h2 style="font-size: 1.8rem; color: var(--text-main);">Citizen Details</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Please provide your details to report road damage.</p>
        </div>

        <form id="citizenLoginForm" onsubmit="handleCitizenLogin(event)">
            <div class="form-group mb-4">
                <label for="name" style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-main);">Name (Required)</label>
                <input type="text" id="name" class="form-control" required style="width: 100%; border-radius: 0.5rem;">
            </div>
            
            <div class="form-group mb-4">
                <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-main);">Email ID (Required)</label>
                <input type="email" id="email" class="form-control" required style="width: 100%; border-radius: 0.5rem;">
            </div>

            <div class="form-group mb-6">
                <label for="phone" style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-main);">Phone Number (Optional)</label>
                <input type="tel" id="phone" class="form-control" style="width: 100%; border-radius: 0.5rem;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 1rem;">Continue <i class="fa-solid fa-arrow-right" style="margin-left: 0.5rem;"></i></button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function handleCitizenLogin(event) {
        event.preventDefault();
        
        const citizenData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value
        };
        
        // Store in localStorage directly without encryption for simplicity in hackathon
        localStorage.setItem('citizenData', JSON.stringify(citizenData));
        
        // Redirect to report page
        window.location.href = '/report';
    }

    // Auto-fill if already "logged in"
    window.onload = function() {
        const stored = localStorage.getItem('citizenData');
        if (stored) {
            const data = JSON.parse(stored);
            document.getElementById('name').value = data.name || '';
            document.getElementById('email').value = data.email || '';
            document.getElementById('phone').value = data.phone || '';
        }
    };
</script>
{% endblock %}
