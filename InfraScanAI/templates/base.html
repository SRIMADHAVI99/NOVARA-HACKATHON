<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infra Scan AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS for reliable map fallback -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand" style="text-decoration: none;">Infra Scan AI <i class="fa-solid fa-road"></i></a>
        <div class="nav-links">
            <a href="/"><i class="fa-solid fa-house mr-1"></i> Home</a>
            <a href="/report"><i class="fa-solid fa-camera mr-1"></i> Report Damage</a>
            <a href="/my_reports"><i class="fa-solid fa-folder-open mr-1"></i> My Reports</a>
            <a href="/admin"><i class="fa-solid fa-gauge-high mr-1"></i> Dashboard</a>
        </div>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Main scripts -->
    {% block scripts %}{% endblock %}
</body>
</html>
