<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Road Surface -->
  <polygon points="16,54 48,54 39,18 25,18" fill="#0f172a"/>
  <!-- Road Edge Lines -->
  <line x1="16" y1="54" x2="25" y2="18" stroke="#64748b" stroke-width="2"/>
  <line x1="48" y1="54" x2="39" y2="18" stroke="#64748b" stroke-width="2"/>
  <!-- Center Dashed Road Markings -->
  <line x1="32" y1="52" x2="32" y2="20" stroke="#f8fafc" stroke-width="2" stroke-dasharray="5 4"/>
  
  <!-- AI Scan Crosshair / Reticle -->
  <circle cx="32" cy="34" r="15" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 4"/>
  <circle cx="32" cy="34" r="5" fill="#38bdf8"/>
  <circle cx="32" cy="34" r="2" fill="#ffffff"/>
  
  <!-- AI Scanner Bracket Corners -->
  <path d="M 14,16 L 14,10 L 20,10" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 50,16 L 50,10 L 44,10" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 14,48 L 14,54 L 20,54" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 50,48 L 50,54 L 44,54" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
</svg>
